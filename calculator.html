<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="header"></div>
    <div id="navbar"></div>

    <div class="profile-container" style="padding-bottom: 60px;">

        <div class="profile-card" style="width: 380px; text-align: center;">

            <h1 style="color: #263445; font-size: 28px; margin-bottom: 10px;">Calculator</h1>

            <div class="profile-line"></div>

            <div
                style="margin-top: 20px; background-color: #263445; padding: 20px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.2);">
                <input type="text" id="calcDisplay" readonly placeholder="0"
                    style="width: 100%; height: 48px; background-color: #ffffff; color: #263445; border: 2px solid #ccc; border-radius: 8px; font-size: 24px; font-weight: bold; text-align: right; padding: 0 12px; margin-bottom: 18px; outline: none;">

                <table border="0" cellspacing="8" cellpadding="0" style="width: 100%;">
                    <tr>
                        <td><button type="button" onclick="clearCalc()"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: #d9534f; color: white; transition: 0.2s;"
                                onmouseover="this.style.background='#c9302c'"
                                onmouseout="this.style.background='#d9534f'">C</button></td>
                        <td><button type="button" onclick="backspaceCalc()"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: #f39c12; color: white; transition: 0.2s;"
                                onmouseover="this.style.background='#e67e22'"
                                onmouseout="this.style.background='#f39c12'">⌫</button></td>
                        <td><button type="button" onclick="appendCalcVal('.')"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: #e0e0e0; transition: 0.2s;"
                                onmouseover="this.style.background='#ccc'"
                                onmouseout="this.style.background='#e0e0e0'">.</button></td>
                        <td><button type="button" onclick="appendCalcVal('/')"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: orange; color: white; transition: 0.2s;"
                                onmouseover="this.style.background='#e67e22'"
                                onmouseout="this.style.background='orange'">/</button></td>
                    </tr>
                    <tr>
                        <td><button type="button" onclick="appendCalcVal('7')"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: #e0e0e0; transition: 0.2s;"
                                onmouseover="this.style.background='#ccc'"
                                onmouseout="this.style.background='#e0e0e0'">7</button></td>
                        <td><button type="button" onclick="appendCalcVal('8')"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: #e0e0e0; transition: 0.2s;"
                                onmouseover="this.style.background='#ccc'"
                                onmouseout="this.style.background='#e0e0e0'">8</button></td>
                        <td><button type="button" onclick="appendCalcVal('9')"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: #e0e0e0; transition: 0.2s;"
                                onmouseover="this.style.background='#ccc'"
                                onmouseout="this.style.background='#e0e0e0'">9</button></td>
                        <td><button type="button" onclick="appendCalcVal('*')"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: orange; color: white; transition: 0.2s;"
                                onmouseover="this.style.background='#e67e22'"
                                onmouseout="this.style.background='orange'">*</button></td>
                    </tr>
                    <tr>
                        <td><button type="button" onclick="appendCalcVal('4')"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: #e0e0e0; transition: 0.2s;"
                                onmouseover="this.style.background='#ccc'"
                                onmouseout="this.style.background='#e0e0e0'">4</button></td>
                        <td><button type="button" onclick="appendCalcVal('5')"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: #e0e0e0; transition: 0.2s;"
                                onmouseover="this.style.background='#ccc'"
                                onmouseout="this.style.background='#e0e0e0'">5</button></td>
                        <td><button type="button" onclick="appendCalcVal('6')"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: #e0e0e0; transition: 0.2s;"
                                onmouseover="this.style.background='#ccc'"
                                onmouseout="this.style.background='#e0e0e0'">6</button></td>
                        <td><button type="button" onclick="appendCalcVal('-')"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: orange; color: white; transition: 0.2s;"
                                onmouseover="this.style.background='#e67e22'"
                                onmouseout="this.style.background='orange'">-</button></td>
                    </tr>
                    <tr>
                        <td><button type="button" onclick="appendCalcVal('1')"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: #e0e0e0; transition: 0.2s;"
                                onmouseover="this.style.background='#ccc'"
                                onmouseout="this.style.background='#e0e0e0'">1</button></td>
                        <td><button type="button" onclick="appendCalcVal('2')"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: #e0e0e0; transition: 0.2s;"
                                onmouseover="this.style.background='#ccc'"
                                onmouseout="this.style.background='#e0e0e0'">2</button></td>
                        <td><button type="button" onclick="appendCalcVal('3')"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: #e0e0e0; transition: 0.2s;"
                                onmouseover="this.style.background='#ccc'"
                                onmouseout="this.style.background='#e0e0e0'">3</button></td>
                        <td><button type="button" onclick="appendCalcVal('+')"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: orange; color: white; transition: 0.2s;"
                                onmouseover="this.style.background='#e67e22'"
                                onmouseout="this.style.background='orange'">+</button></td>
                    </tr>
                    <tr>
                        <td colspan="2"><button type="button" onclick="appendCalcVal('0')"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: #e0e0e0; transition: 0.2s;"
                                onmouseover="this.style.background='#ccc'"
                                onmouseout="this.style.background='#e0e0e0'">0</button></td>
                        <td colspan="2"><button type="button" onclick="calculateResult()"
                                style="width: 100%; height: 42px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: #27ae60; color: white; transition: 0.2s;"
                                onmouseover="this.style.background='#219150'"
                                onmouseout="this.style.background='#27ae60'">=</button></td>
                    </tr>
                </table>
            </div>

        </div>

    </div>

    </div>

    <div id="footer"></div>

    <script src="web.js"></script>
</body>

</html>
