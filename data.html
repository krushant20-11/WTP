<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking - Hotel Management System</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="header"></div>
    <div id="navbar"></div>

    <div class="profile-container" style="padding-bottom: 60px;">

        <div class="profile-card" style="width: 560px; text-align: left;">

            <h1 style="text-align: center; margin-bottom: 10px;">Hotel Room Booking</h1>

            <div class="profile-line"></div>

            <!-- Simple Success Message Banner -->
            <div id="dataSubmittedMsg" style="display: none; margin-bottom: 20px; padding: 12px 16px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: 5px; text-align: center; font-weight: bold; font-size: 15px;">
                Data submitted successfully!
            </div>

            <form id="hotelBookingForm" onsubmit="return validateHotelForm(event)" novalidate>
                
                <!-- Full Name -->
                <div style="margin-bottom: 16px;">
                    <label for="fullName" style="display: block; font-weight: bold; color: #263445; margin-bottom: 6px;">
                        Full Name <span style="color: red;">*</span>
                    </label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter guest full name"
                        style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; outline: none; transition: 0.3s;"
                        onfocus="this.style.borderColor='orange'" onblur="this.style.borderColor='#ccc'">
                    <small id="fullNameErr" style="color: #d9534f; font-size: 13px; display: block; margin-top: 4px; font-weight: bold;"></small>
                </div>

                <!-- Email Address -->
                <div style="margin-bottom: 16px;">
                    <label for="email" style="display: block; font-weight: bold; color: #263445; margin-bottom: 6px;">
                        Email Address <span style="color: red;">*</span>
                    </label>
                    <input type="email" id="email" name="email" placeholder="example@domain.com"
                        style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; outline: none; transition: 0.3s;"
                        onfocus="this.style.borderColor='orange'" onblur="this.style.borderColor='#ccc'">
                    <small id="emailErr" style="color: #d9534f; font-size: 13px; display: block; margin-top: 4px; font-weight: bold;"></small>
                </div>

                <!-- Mobile Number -->
                <div style="margin-bottom: 16px;">
                    <label for="mobile" style="display: block; font-weight: bold; color: #263445; margin-bottom: 6px;">
                        Mobile Number <span style="color: red;">*</span>
                    </label>
                    <input type="text" id="mobile" name="mobile" placeholder="Enter 10-digit mobile number" maxlength="10"
                        style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; outline: none; transition: 0.3s;"
                        onfocus="this.style.borderColor='orange'" onblur="this.style.borderColor='#ccc'">
                    <small id="mobileErr" style="color: #d9534f; font-size: 13px; display: block; margin-top: 4px; font-weight: bold;"></small>
                </div>

                <!-- Room Type -->
                <div style="margin-bottom: 16px;">
                    <label for="roomType" style="display: block; font-weight: bold; color: #263445; margin-bottom: 6px;">
                        Room Type <span style="color: red;">*</span>
                    </label>
                    <select id="roomType" name="roomType"
                        style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; outline: none; transition: 0.3s; background-color: white;"
                        onfocus="this.style.borderColor='orange'" onblur="this.style.borderColor='#ccc'">
                        <option value="">-- Select Room Type --</option>
                        <option value="Single Room">Single Room</option>
                        <option value="Double Room">Double Room</option>
                        <option value="Deluxe Suite">Deluxe Suite</option>
                        <option value="Executive Suite">Executive Suite</option>
                    </select>
                    <small id="roomTypeErr" style="color: #d9534f; font-size: 13px; display: block; margin-top: 4px; font-weight: bold;"></small>
                </div>

                <!-- Number of Guests -->
                <div style="margin-bottom: 16px;">
                    <label for="guests" style="display: block; font-weight: bold; color: #263445; margin-bottom: 6px;">
                        Number of Guests <span style="color: red;">*</span>
                    </label>
                    <input type="number" id="guests" name="guests" min="1" max="10" placeholder="e.g. 2"
                        style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; outline: none; transition: 0.3s;"
                        onfocus="this.style.borderColor='orange'" onblur="this.style.borderColor='#ccc'">
                    <small id="guestsErr" style="color: #d9534f; font-size: 13px; display: block; margin-top: 4px; font-weight: bold;"></small>
                </div>

                <!-- Check-in Date -->
                <div style="margin-bottom: 16px;">
                    <label for="checkIn" style="display: block; font-weight: bold; color: #263445; margin-bottom: 6px;">
                        Check-in Date <span style="color: red;">*</span>
                    </label>
                    <input type="date" id="checkIn" name="checkIn"
                        style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; outline: none; transition: 0.3s;"
                        onfocus="this.style.borderColor='orange'" onblur="this.style.borderColor='#ccc'">
                    <small id="checkInErr" style="color: #d9534f; font-size: 13px; display: block; margin-top: 4px; font-weight: bold;"></small>
                </div>

                <!-- Check-out Date -->
                <div style="margin-bottom: 16px;">
                    <label for="checkOut" style="display: block; font-weight: bold; color: #263445; margin-bottom: 6px;">
                        Check-out Date <span style="color: red;">*</span>
                    </label>
                    <input type="date" id="checkOut" name="checkOut"
                        style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; outline: none; transition: 0.3s;"
                        onfocus="this.style.borderColor='orange'" onblur="this.style.borderColor='#ccc'">
                    <small id="checkOutErr" style="color: #d9534f; font-size: 13px; display: block; margin-top: 4px; font-weight: bold;"></small>
                </div>

                <!-- Action Buttons -->
                <div style="display: flex; gap: 15px; margin-top: 25px;">
                    <button type="submit" class="back-button" style="border: none; cursor: pointer; flex: 1; text-align: center; font-size: 16px; margin-top: 0;">
                        Book Room
                    </button>
                    <button type="reset" onclick="clearFormErrors()" class="back-button" style="border: none; cursor: pointer; flex: 1; text-align: center; font-size: 16px; margin-top: 0;">
                        Reset
                    </button>
                </div>

            </form>

        </div>

    </div>

    <div id="footer"></div>

    <script src="web.js"></script>

</body>
</html>
